<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Scouter — Global YouTube Trending</title>
  <meta name="description" content="Discover trending YouTube videos across 16 countries. Global, country, category, and Creative Commons reuse charts.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://contentscouter.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Content Scouter">
  <meta property="og:description" content="Trending YouTube videos across 16 countries — by views.">
  <meta property="og:url" content="https://contentscouter.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Content Scouter">
  <meta name="twitter:description" content="Global YouTube trending research.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Content Scouter",
    "url": "https://contentscouter.com/",
    "description": "Discover trending YouTube videos across 16 countries.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web"
  }
  </script>
  <script defer src="analytics.js"></script>
  <style>
    /* Exact page frame — no fixed ads, no calc guesswork */
    *{box-sizing:border-box}
    :root{
      --ad-w:200px;
      --ad-gap:24px;
      --main-w:1100px;
      --frame-w:calc(var(--ad-w) + var(--ad-gap) + var(--main-w) + var(--ad-gap) + var(--ad-w)); /* 1548px */
      --page-pad:20px;
      --frame-nudge:11px; /* whole frame shift; was 16px, moved 5px left */
      --page-gray:#505050;
    }
    html,body{margin:0;padding:0;background:var(--page-gray);color:#eef1f6;font-family:Arial,"Segoe UI",sans-serif}
    html{overflow-x:hidden;overflow-y:scroll}
    body{min-height:100vh}

    .siteHead{
      display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
      background:#0d0f14;border-bottom:1px solid #2a2f3c;
      padding:12px 24px;
    }
    .siteLogo{
      display:inline-flex;align-items:center;line-height:0;text-decoration:none;
    }
    .siteLogoImg{
      display:block;height:72px;width:auto;max-width:min(280px,52vw);object-fit:contain;
    }
    @media(min-width:700px){
      .siteLogoImg{height:96px;max-width:340px}
    }
    .siteLegal{
      display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
      color:#a8b0bc;font-size:12px;line-height:1.4;margin-left:auto;
    }
    .siteLegal a{color:#c8d4e0;text-decoration:none;white-space:nowrap}
    .siteLegal a:hover{color:#fff;text-decoration:underline}
    .siteLegal .sep{color:#6a7380;user-select:none}
    .siteLegal .copy{color:#9aa3b0;white-space:nowrap}

    a{color:inherit;text-decoration:none}

    .pageRow{width:100%;padding:0}
    .pageRowInner{
      display:grid;
      grid-template-columns:var(--ad-w) var(--main-w) var(--ad-w);
      column-gap:var(--ad-gap);
      width:var(--frame-w);
      max-width:calc(100% - 2 * var(--page-pad));
      margin:0 auto;
      padding:20px var(--page-pad) 48px;
      align-items:start;
      position:relative;
      left:var(--frame-nudge); /* nudge without transform (transform breaks sticky ads) */
    }
    .adCol{
      width:var(--ad-w);
      min-width:0;
      position:sticky;
      top:20px;
      align-self:start;
      z-index:4;
    }
    .centerPanel{width:var(--main-w);min-width:0;max-width:100%}

    /* When the viewport is narrower than the frame, keep ad columns fixed and shrink only the center */
    @media(max-width:1588px){
      .pageRowInner{
        width:100%;
        grid-template-columns:var(--ad-w) minmax(0,1fr) var(--ad-w);
      }
      .centerPanel{width:auto}
    }

    .keywordProAd{
      display:flex;flex-direction:column;width:100%;min-height:640px;padding:14px 12px 16px;
      background:linear-gradient(165deg,#0f1a2e 0%,#0a1220 50%,#060d18 100%);
      border:2px solid rgba(214,176,78,.65);border-radius:12px;color:#e8edf5;
      box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 1px rgba(214,176,78,.12);
      transition:transform .18s,box-shadow .18s;text-decoration:none;
    }
    .keywordProAd:hover{
      transform:translateY(-4px);
      box-shadow:0 16px 48px rgba(0,0,0,.55),0 0 24px rgba(214,176,78,.15);
      border-color:rgba(255,217,90,.85);
    }
    .keywordProLogo{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:10px;object-fit:contain;background:#f5f6f8;padding:6px 4px;}
    .keywordProBody{display:block;margin-top:2px}
    .keywordProTag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0a1220;background:#ffd95a;border-radius:999px;padding:3px 8px;margin-bottom:8px;}
    .keywordProTitle{display:block;font-size:15px;font-weight:800;line-height:1.35;color:#f3f7ff;margin:0 0 8px;}
    .keywordProLine{display:block;font-size:12px;line-height:1.5;color:#b8c8dc;font-weight:400;margin-bottom:5px;}
    .keywordProCta{display:block;margin:10px 0;padding-top:8px;font-size:13px;font-weight:600;color:#ffd95a;border-top:1px solid rgba(214,176,78,.3);}
    .keywordProPhoto{display:block;width:100%;min-height:120px;margin-top:auto;border-radius:8px;border:1px solid rgba(214,176,78,.35);object-fit:contain;background:#fff;}

    @media(max-width:960px){
      .siteHead{padding:12px 14px}
      .siteLegal{font-size:11px;gap:4px 8px;justify-content:flex-end;width:100%;margin-left:0}
      .pageRowInner{
        display:flex;flex-direction:column;align-items:center;gap:16px;
        width:100%;max-width:100%;padding:16px;
      }
      .adCol{width:100%;max-width:480px;position:static}
      .centerPanel{width:100%;max-width:100%}
      .keywordProAd{min-height:auto;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;gap:10px;padding:14px;text-align:left}
      .keywordProCta{margin:0;border-top:0;padding-top:0}
      .keywordProPhoto{max-width:120px;margin-top:0}
      .keywordProLogo{max-width:160px;margin-bottom:0}
      .centerPanel{border-radius:12px;border:2px solid #1e2433}
    }
  </style>
  <!--SCOUTER_ASSETS-->
</head>
<body>

  <header class="siteHead">
    <a class="siteLogo" href="index.html" aria-label="Content Scouter">
      <img class="siteLogoImg" src="content-scouter-logo.png" alt="Content Scouter" width="340" height="96" />
    </a>
    <nav class="siteLegal" aria-label="Site">
      <a href="about.html">About</a>
      <span class="sep">|</span>
      <a href="terms.html">Terms</a>
      <span class="sep">|</span>
      <a href="privacy.html">Privacy</a>
      <span class="sep">|</span>
      <a href="contact.html">Contact</a>
      <span class="sep">|</span>
      <span class="copy">Copyright © 2026 contentscouter.com</span>
    </nav>
  </header>

  <section id="scouter" class="pageRow">
    <div class="pageRowInner">
      <aside class="adCol">
        <a class="keywordProAd" data-ad-placement="left" href="https://getkeypro.com/" target="_blank" rel="noopener">
          <img class="keywordProLogo" src="keyword-pro-logo.png" alt="Keyword Pro — Smart Keyword Analysis" loading="lazy">
          <div class="keywordProBody">
            <span class="keywordProTag">Paid · Live Analytics</span>
            <span class="keywordProTitle">Hooking &amp; Industry charts</span>
            <span class="keywordProLine">Real-time keyword trend data</span>
            <span class="keywordProLine">Competitor &amp; PDF reports</span>
            <span class="keywordProLine">16-country market coverage</span>
          </div>
          <span class="keywordProCta">Open Keyword Pro →</span>
          <img class="keywordProPhoto" src="keyword-pro-ad-bottom.png" alt="Keyword Pro — Find Keywords, Get Insights, Grow Faster" loading="lazy">
        </a>
      </aside>

      <div class="centerPanel">
        <!--SCOUTER_MOUNT-->
      </div>

      <aside class="adCol" aria-hidden="true"></aside>
    </div>
  </section>

  <!--SCOUTER_SCRIPT-->
</body>
</html>
