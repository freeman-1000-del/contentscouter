<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 쇼츠 검색 — 컨텐츠 스카우터</title>
<meta name="description" content="유튜브 쇼핑·제품 쇼츠만 모아 검색. 한국·미국 지역별 조회수순 쇼핑 쇼츠 탐색.">
<meta name="keywords" content="쇼핑 쇼츠,유튜브 쇼핑,제품 쇼츠,쇼츠 검색,제품 리뷰,언박싱">
<meta property="og:title" content="쇼핑 쇼츠 검색 — 컨텐츠 스카우터">
<meta property="og:description" content="유튜브 쇼핑·제품 쇼츠만 모아 검색하세요.">
<meta property="og:url" content="https://contentscouter.com/shop/">
<meta property="og:locale" content="ko_KR">
<link rel="canonical" href="https://contentscouter.com/shop/">
<link rel="alternate" hreflang="ko" href="https://contentscouter.com/shop/">
<link rel="alternate" hreflang="en" href="https://contentscouter.com/shop/en/">
<link rel="alternate" hreflang="x-default" href="https://contentscouter.com/shop/">
<meta name="robots" content="index, follow">
<script>
  window.SCOUTER_CONFIG = {
    SUPABASE_URL: 'https://ajvtyotblrtexcxuazqm.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_cmn9eVnnvaAjXVJWa6bRQA_qrb1xglQ',
    SHOPPING_SHORTS_URL: 'https://ajvtyotblrtexcxuazqm.supabase.co/functions/v1/shopping-shorts-search'
  };
</script>
<style>
  :root{
    --bg:#0d0f14; --panel:#161922; --line:#2a2f3c;
    --txt:#eef1f6; --sub:#aeb6c4; --accent:#ffb454; --good:#46d39a; --bad:#ff8b8b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;
    line-height:1.5;padding:24px 16px 64px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:28px;margin:8px 0 6px;color:var(--accent)}
  .lead{color:var(--sub);margin-bottom:18px;font-size:15px}
  .panel{
    border:1px solid var(--line);border-radius:16px;background:var(--panel);
    padding:16px;margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:700}
  input,select{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0f131a;color:var(--txt);font-size:15px;
  }
  .row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
  @media(max-width:800px){.row{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    border:1px solid var(--line);background:#121722;color:var(--txt);
    border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .btn{
    border:1px solid var(--accent);background:linear-gradient(180deg,#5c4315,#1a140a);
    color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:14px;
  }
  .btn.secondary{border-color:var(--line);background:#121722}
  .note{margin-top:10px;font-size:13px;color:var(--sub)}
  .note b{color:var(--accent)}
  .err{color:var(--bad)}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;
    align-items:start;
  }
  .card{
    display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#121722;
  }
  .card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000}
  .card .body{padding:10px 12px}
  .card .t{font-size:13px;font-weight:800;line-height:1.35;margin-bottom:6px}
  .card .m{font-size:12px;color:var(--sub)}
  .state{padding:28px;text-align:center;color:var(--sub)}
  .spin{
    width:28px;height:28px;border-radius:50%;margin:0 auto 10px;
    border:3px solid #333;border-top-color:var(--accent);animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .topnav{display:flex;flex-wrap:wrap;gap:12px 18px;margin-bottom:10px;align-items:center}
  .topnav a{color:var(--accent);font-weight:800;text-decoration:none;font-size:14px}
  .lang{margin-left:auto;font-size:13px}
  .lang a{color:var(--sub);margin-left:10px}
  .lang a.on{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a href="/">← 컨텐츠 스카우터</a>
    <div class="lang">
      <a class="on" href="/shop/">한국어</a>
      <a href="/shop/en/">English</a>
    </div>
  </div>
  <h1>쇼핑 쇼츠 검색</h1>
  <p class="lead">유튜브 쇼핑·제품·리뷰 쇼츠만 골라 봅니다. 한국(KR) / 미국(US) 지역 기준, 조회수순.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="region">지역</label>
        <select id="region">
          <option value="KR" selected>한국 (KR)</option>
          <option value="US">미국 (US)</option>
        </select>
      </div>
      <div>
        <label for="period">게시 기간</label>
        <select id="period">
          <option value="7">7일</option>
          <option value="30" selected>30일</option>
          <option value="90">90일</option>
          <option value="365">1년</option>
          <option value="0">전체</option>
        </select>
      </div>
      <div>
        <label for="q">키워드</label>
        <input id="q" type="text" placeholder="예: 가성비 이어폰, 여름 원피스, 템 추천">
      </div>
    </div>
    <div class="chips" id="presets"></div>
    <div class="actions">
      <button class="btn" type="button" id="btnSearch">쇼츠 검색</button>
      <button class="btn secondary" type="button" id="btnCsv">CSV 다운로드</button>
    </div>
    <p class="note" id="apiNote">키워드를 고르거나 입력한 뒤 검색하세요. (검색 1회 ≈ 101 API units)</p>
  </div>

  <div id="content"><div class="state">아직 결과가 없습니다.</div></div>
</div>

<script>
(function(){
  var CFG = window.SCOUTER_CONFIG || {};
  var URL = CFG.SHOPPING_SHORTS_URL || (CFG.SUPABASE_URL + '/functions/v1/shopping-shorts-search');
  var ANON = CFG.SUPABASE_ANON_KEY || '';
  var lastRows = [];

  var PRESETS_KR = [
    '쇼핑 쇼츠','가성비 추천','언박싱','제품 리뷰','여름 원피스',
    '이어폰 추천','스킨케어','주방템','홈카페','쿠팡 추천'
  ];
  var PRESETS_US = [
    'shopping haul','amazon finds','product review','unboxing',
    'tiktok made me buy','temu haul','skincare','gadgets','home finds'
  ];

  function currentPresets(){
    return document.getElementById('region').value === 'US' ? PRESETS_US : PRESETS_KR;
  }

  function renderPresets(){
    var presetsEl = document.getElementById('presets');
    presetsEl.innerHTML = '';
    currentPresets().forEach(function(p){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = p;
      b.addEventListener('click', function(){
        document.getElementById('q').value = p;
        presetsEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
        b.classList.add('on');
      });
      presetsEl.appendChild(b);
    });
  }

  document.getElementById('region').addEventListener('change', renderPresets);
  renderPresets();

  function fmt(n){
    n = Number(n) || 0;
    if(n >= 1e8) return (n/1e8).toFixed(1) + '억';
    if(n >= 1e4) return (n/1e4).toFixed(1) + '만';
    if(n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return String(n);
  }
  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }
  function setNote(html, isErr){
    var el = document.getElementById('apiNote');
    el.className = 'note' + (isErr ? ' err' : '');
    el.innerHTML = html;
  }

  function render(rows){
    lastRows = rows || [];
    var box = document.getElementById('content');
    if(!lastRows.length){
      box.innerHTML = '<div class="state">일치하는 쇼핑 쇼츠가 없습니다. 키워드를 바꿔 보세요.</div>';
      return;
    }
    box.innerHTML = '<div class="grid">' + lastRows.map(function(v){
      return '<a class="card" href="' + esc(v.youtube_url) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(v.thumbnail_url) + '" alt="" loading="lazy">' +
        '<div class="body"><div class="t">' + esc(v.title) + '</div>' +
        '<div class="m">' + esc(v.channel) + '<br>조회 ' + fmt(v.view_count) + ' · ' + esc(v.country_code) + '</div></div></a>';
    }).join('') + '</div>';
  }

  async function runSearch(){
    var q = String(document.getElementById('q').value || '').trim();
    var regionCode = document.getElementById('region').value;
    var periodDays = parseInt(document.getElementById('period').value, 10);
    if(isNaN(periodDays)) periodDays = 30;
    var content = document.getElementById('content');
    content.innerHTML = '<div class="state"><div class="spin"></div><div>쇼핑 쇼츠 검색 중…</div></div>';
    setNote('검색 중… (≈101 units)');
    try{
      var res = await fetch(URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ANON,
          'Authorization': 'Bearer ' + ANON
        },
        body: JSON.stringify({
          q: q,
          regionCode: regionCode,
          periodDays: periodDays,
          maxResults: 30
        }),
        cache: 'no-store'
      });
      var data = await res.json();
      if(!res.ok || !data.ok){
        content.innerHTML = '<div class="state">검색에 실패했습니다.</div>';
        setNote(esc(data.error || res.statusText), true);
        return;
      }
      setNote('<b>≈' + (data.apiUnits || 101) + ' units</b> · ' + esc(data.apiNote || '') +
        ' · ' + (data.results||[]).length + '개 · 실제쿼리: ' + esc(data.searchQ || ''));
      render(data.results || []);
    }catch(e){
      content.innerHTML = '<div class="state">네트워크 오류</div>';
      setNote(esc(e.message || String(e)), true);
    }
  }

  function downloadCsv(){
    if(!lastRows.length){
      setNote('내보낼 결과가 없습니다. 먼저 검색하세요.', true);
      return;
    }
    var lines = [['rank','video_id','title','channel','views','region','url'].join(',')];
    lastRows.forEach(function(v){
      lines.push([
        v.rank,
        v.video_id,
        '"' + String(v.title||'').replace(/"/g,'""') + '"',
        '"' + String(v.channel||'').replace(/"/g,'""') + '"',
        v.view_count,
        v.country_code,
        v.youtube_url
      ].join(','));
    });
    var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'shopping-shorts.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById('btnSearch').addEventListener('click', runSearch);
  document.getElementById('btnCsv').addEventListener('click', downloadCsv);
  document.getElementById('q').addEventListener('keydown', function(e){
    if(e.key === 'Enter') runSearch();
  });
})();
</script>
<script src="/analytics.js" defer></script>
</body>
</html>
